<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аудит маркетинга — ЧерриДом | Июнь 2026</title>
<style>
:root {
  --cherry: #C62828;
  --cherry-light: #EF5350;
  --dark: #1a1a2e;
  --bg: #f5f6f8;
  --card: #ffffff;
  --green: #2E7D32;
  --orange: #E65100;
  --blue: #1565C0;
  --gray: #616161;
  --border: #e0e0e0;
  --sidebar-w: 260px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: #333; line-height: 1.6; }
.layout { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w);
  background: var(--dark); color: white;
  position: fixed; top: 0; left: 0; bottom: 0;
  overflow-y: auto; z-index: 100; transition: transform 0.3s;
}
.sidebar-header { padding: 24px 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.1); }
.sidebar-header h1 { font-size: 18px; line-height: 1.3; }
.sidebar-header .subtitle { font-size: 12px; color: #90caf9; margin-top: 4px; }
.sidebar-nav { padding: 12px 0; }
.sidebar-nav a {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 20px; color: rgba(255,255,255,0.7);
  text-decoration: none; font-size: 13px;
  border-left: 3px solid transparent; transition: all 0.2s; cursor: pointer;
}
.sidebar-nav a:hover { background: rgba(255,255,255,0.05); color: white; }
.sidebar-nav a.active { background: rgba(255,255,255,0.1); color: white; border-left-color: var(--cherry-light); font-weight: 600; }
.sidebar-nav a .nav-num {
  background: rgba(255,255,255,0.15); width: 22px; height: 22px;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 11px; flex-shrink: 0;
}
.sidebar-nav a.active .nav-num { background: var(--cherry); }
.sidebar-footer { padding: 16px 20px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 11px; color: rgba(255,255,255,0.4); }
.menu-toggle {
  display: none; position: fixed; top: 12px; left: 12px; z-index: 200;
  background: var(--dark); color: white; border: none; padding: 8px 12px;
  border-radius: 8px; font-size: 18px; cursor: pointer;
}
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 90; }
.main { margin-left: var(--sidebar-w); flex: 1; padding: 30px 40px; max-width: 900px; }
.page { display: none; }
.page.active { display: block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.page-header { margin-bottom: 24px; }
.page-header h2 { font-size: 24px; color: var(--dark); margin-bottom: 4px; }
.page-header .page-desc { color: var(--gray); font-size: 14px; }
.page-nav { display: flex; justify-content: space-between; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border); }
.page-nav a {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 18px; border-radius: 8px; text-decoration: none;
  font-size: 13px; font-weight: 600; transition: all 0.2s; cursor: pointer;
}
.page-nav .prev { background: #f5f5f5; color: var(--dark); }
.page-nav .next { background: var(--cherry); color: white; }
.page-nav a:hover { opacity: 0.85; transform: translateY(-1px); }
.card { background: var(--card); border-radius: 12px; padding: 24px; margin-bottom: 20px; border: 1px solid var(--border); }
.card h3 { font-size: 16px; color: var(--dark); margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid #eee; }
table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
th { background: #f8f8f8; text-align: left; padding: 10px 12px; font-weight: 600; border-bottom: 2px solid var(--border); font-size: 12px; text-transform: uppercase; color: var(--gray); }
td { padding: 9px 12px; border-bottom: 1px solid #f0f0f0; }
tr:hover td { background: #fafbfc; }
.num-cell { text-align: right; font-variant-numeric: tabular-nums; }
.good { color: var(--green); font-weight: 600; }
.bad { color: var(--cherry); font-weight: 600; }
.warn { color: var(--orange); font-weight: 600; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 16px 0; }
.metric { background: #f8f9fa; border-radius: 10px; padding: 16px; text-align: center; border: 1px solid #eee; }
.metric .value { font-size: 26px; font-weight: 700; color: var(--dark); }
.metric .label { font-size: 11px; color: var(--gray); margin-top: 4px; }
.metric .delta { font-size: 11px; margin-top: 4px; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.tag-red { background: #ffebee; color: var(--cherry); }
.tag-green { background: #e8f5e9; color: var(--green); }
.tag-orange { background: #fff3e0; color: var(--orange); }
.tag-blue { background: #e3f2fd; color: var(--blue); }
.finding { padding: 14px 18px; border-radius: 8px; margin: 12px 0; border-left: 4px solid; font-size: 14px; }
.finding-critical { background: #ffebee; border-color: var(--cherry); }
.finding-warn { background: #fff8e1; border-color: #f9a825; }
.finding-good { background: #e8f5e9; border-color: var(--green); }
.finding-info { background: #e3f2fd; border-color: var(--blue); }
.finding strong { display: block; margin-bottom: 4px; }
.check-list { list-style: none; padding: 0; }
.check-list li { padding: 5px 0 5px 26px; position: relative; font-size: 14px; }
.check-list li::before { position: absolute; left: 0; top: 7px; width: 16px; height: 16px; border-radius: 3px; font-size: 10px; display: flex; align-items: center; justify-content: center; color: white; }
.check-list .yes::before { content: '\2713'; background: var(--green); }
.check-list .no::before { content: '\2717'; background: var(--cherry); }
.check-list .partial::before { content: '~'; background: var(--orange); }
.summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0; }
.summary-card { background: var(--card); border-radius: 10px; padding: 18px; border: 1px solid var(--border); }
.summary-card h4 { font-size: 13px; text-transform: uppercase; color: var(--gray); margin-bottom: 10px; }
@media (max-width: 860px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .menu-toggle { display: block; }
  .overlay.open { display: block; }
  .main { margin-left: 0; padding: 60px 16px 30px; }
  .metrics { grid-template-columns: 1fr 1fr; }
  .summary-grid { grid-template-columns: 1fr; }
  table { font-size: 12px; }
  td, th { padding: 6px 8px; }
}
</style>
</head>
<body>
<button class="menu-toggle" onclick="toggleMenu()">&#9776;</button>
<div class="overlay" onclick="toggleMenu()"></div>
<div class="layout">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1>Аудит маркетинга</h1>
    <div class="subtitle">ЧерриДом &mdash; 3 июня 2026</div>
  </div>
  <nav class="sidebar-nav" id="nav"></nav>
  <div class="sidebar-footer">LOS Agency<br>Метрика + Битрикс24 + План-факт</div>
</aside>
<main class="main" id="main"></main>
</div>
<script>
const PAGES = [
{id:'summary',num:'0',title:'Сводка',html:`

<tr><td>2</td><td>589 сделок зависли на квалификации</td><td>~133 млн заморожено</td><td><span class="tag tag-red">P1</span></td></tr>

</ul></div></div>
`},

<tr><td>Владис (агентский)</td><td class="num-cell">33%</td><td><span class="tag tag-orange">Зависимость, комиссия ~3%</span></td></tr>
<tr><td>Другие АН</td><td class="num-cell">13%</td><td>Стабильно</td></tr></table>
<div class="finding finding-warn"><strong>46% через агентов</strong>Комиссия ~220 тыс/сделку. Рост прямого канала &mdash; приоритет.</div></div>
<div class="card"><h3>Эксперты отдела продаж</h3>

{id:'crm',num:'2',title:'CRM и воронка',html:`

// Build nav
const nav = document.getElementById('nav');
PAGES.forEach(p => {
  const a = document.createElement('a');
  a.dataset.page = p.id;
  a.innerHTML = '<span class="nav-num">'+p.num+'</span> '+p.title;
  if(p.id==='summary') a.classList.add('active');
  nav.appendChild(a);
});

// Build pages
const main = document.getElementById('main');
PAGES.forEach((p,i) => {
  const div = document.createElement('div');
  div.className = 'page' + (p.id==='summary'?' active':'');
  div.id = 'page-'+p.id;
  let pnav = '<div class="page-nav">';
  if(i>0) pnav += '<a class="prev" data-page="'+PAGES[i-1].id+'">&larr; '+PAGES[i-1].title+'</a>'; else pnav += '<span></span>';
  if(i<PAGES.length-1) pnav += '<a class="next" data-page="'+PAGES[i+1].id+'">'+PAGES[i+1].title+' &rarr;</a>'; else pnav += '<span></span>';
  pnav += '</div>';
  div.innerHTML = p.html + pnav;
  main.appendChild(div);
});

function showPage(id) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.sidebar-nav a').forEach(a=>a.classList.remove('active'));
  const t = document.getElementById('page-'+id);
  if(t) t.classList.add('active');
  document.querySelectorAll('.sidebar-nav a').forEach(a=>{ if(a.dataset.page===id) a.classList.add('active'); });
  window.scrollTo(0,0);
  if(window.innerWidth<=860){ document.getElementById('sidebar').classList.remove('open'); document.querySelector('.overlay').classList.remove('open'); }
  history.replaceState(null,'','#'+id);
}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-page]');
  if(a){ e.preventDefault(); showPage(a.dataset.page); }
});

function toggleMenu() {
  document.getElementById('sidebar').classList.toggle('open');
  document.querySelector('.overlay').classList.toggle('open');
}

const hash = location.hash.replace('#','');
if(hash) showPage(hash);
</script>
